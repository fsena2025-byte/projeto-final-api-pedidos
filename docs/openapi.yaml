openapi: 3.1.0
info:
  title: API de Pedidos
  version: 1.0.0
  description: API de domínio único para criação e consulta de pedidos
servers:
  - url: http://localhost:8000
paths:
  /orders:
    post:
      summary: Criar pedido
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, items]
              properties:
                customer: { type: string, minLength: 1 }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product, quantity, unit_price]
                    properties:
                      product: { type: string, minLength: 1 }
                      quantity: { type: integer, minimum: 1 }
                      unit_price: { type: number, exclusiveMinimum: 0 }
      responses:
        '201': { description: Pedido criado }
        '400': { description: Dados inválidos }
  /orders/{orderId}:
    get:
      summary: Consultar pedido
      operationId: getOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Pedido encontrado }
        '404': { description: Pedido não encontrado }
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: API saudável }
  /metrics:
    get:
      summary: Métricas simples
      responses:
        '200': { description: Contador de requisições }
